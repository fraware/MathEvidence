name: p02-same-category-followup-preregistered-study

on:
  push:
    branches:
      - science/p02-same-category-v2-20261001
    paths:
      - .github/workflows/p02-same-category-v2-study.yml

permissions:
  contents: write

concurrency:
  group: p02-same-category-followup-preregistered-study
  cancel-in-progress: false

env:
  PREREG_COMMIT: 03e2d240806877e028514abb11e101b83951b5aa
  PINNED_PROJECT_SHA: 946d2f7b14840837a5b641150c9df9008c4be9eb
  CLASSIFIER_V2_BLOB_SHA: 75d0599c277806007b1f31db451dbbe1bec3962e
  RAW_DIR: evidence/p02_same_category_v2/raw_first_full
  CLASSIFIED_DIR: evidence/p02_same_category_v2/classified_first_full
  ANALYSIS_DIR: evidence/p02_same_category_v2/analysis_first_full
  LEAN_GITHUB_ASSET_URL: https://github.com/leanprover/lean4/releases/download/v4.14.0/lean-4.14.0-linux.tar.zst

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full evidence history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify preregistration boundary and frozen classifier
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${PREREG_COMMIT}^{commit}"
          git merge-base --is-ancestor "${PREREG_COMMIT}" HEAD
          test "$(git rev-parse HEAD:scripts/p02_classify_native_v2_hardened.py)" = "${CLASSIFIER_V2_BLOB_SHA}"
          git show "${PREREG_COMMIT}:experiments/p02_same_category_v2/CASE_SPEC.json" > /tmp/P02_CASE_SPEC.json
          cmp /tmp/P02_CASE_SPEC.json experiments/p02_same_category_v2/CASE_SPEC.json
          python -m py_compile scripts/p02_same_category_collect.py scripts/p02_same_category_classify.py scripts/p02_same_category_analyze.py
          test ! -e "${RAW_DIR}"
          test ! -e "${CLASSIFIED_DIR}"
          test ! -e "${ANALYSIS_DIR}"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Materialize exact pinned MathEvidence worktree
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${PINNED_PROJECT_SHA}^{commit}"
          rm -rf /tmp/mathevidence-pinned
          git worktree add --detach /tmp/mathevidence-pinned "${PINNED_PROJECT_SHA}"
          test "$(git -C /tmp/mathevidence-pinned rev-parse HEAD)" = "${PINNED_PROJECT_SHA}"
          test -z "$(git -C /tmp/mathevidence-pinned status --porcelain)"
          test "$(cat /tmp/mathevidence-pinned/lean-toolchain)" = "leanprover/lean4:v4.14.0"

      - name: Install checksum-pinned elan
        shell: bash
        run: bash /tmp/mathevidence-pinned/scripts/ci/install-elan-pinned.sh

      - name: Initialize exact Lean 4.14.0
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cd /tmp/mathevidence-pinned
          success=0
          lean_output=""
          for attempt in 1 2 3 4 5; do
            if lean_output="$(lake env lean --version 2>&1)"; then
              success=1
              export P02_LEAN_BIN_DIR="$HOME/.elan/bin"
              export P02_TOOLCHAIN_TRANSPORT="elan_release_host"
              export P02_TOOLCHAIN_ARCHIVE_SHA256=""
              break
            fi
            printf '%s\n' "$lean_output" >&2
            if [ "$attempt" -lt 5 ]; then sleep 5; fi
          done
          if [ "$success" -ne 1 ]; then
            rm -rf /tmp/p02-lean-direct /tmp/p02-lean-4.14.0-linux.tar.zst
            mkdir -p /tmp/p02-lean-direct
            curl --fail --location --retry 5 --retry-all-errors --output /tmp/p02-lean-4.14.0-linux.tar.zst "${LEAN_GITHUB_ASSET_URL}"
            archive_sha="$(sha256sum /tmp/p02-lean-4.14.0-linux.tar.zst | awk '{print $1}')"
            tar --use-compress-program=unzstd -xf /tmp/p02-lean-4.14.0-linux.tar.zst -C /tmp/p02-lean-direct
            lean_root="$(find /tmp/p02-lean-direct -mindepth 1 -maxdepth 1 -type d -name 'lean-4.14.0-*' -print -quit)"
            test -n "$lean_root"
            export P02_LEAN_BIN_DIR="$lean_root/bin"
            export P02_TOOLCHAIN_TRANSPORT="official_github_release_asset"
            export P02_TOOLCHAIN_ARCHIVE_SHA256="sha256:${archive_sha}"
            export PATH="$P02_LEAN_BIN_DIR:$PATH"
            lean_output="$(lake env lean --version 2>&1)"
          fi
          export PATH="$P02_LEAN_BIN_DIR:$PATH"
          printf '%s\n' "$lean_output" | grep -F 'Lean (version 4.14.0,'
          printf '%s\n' "$lean_output" | grep -F 'commit 410fab728470'
          test -z "$(git status --porcelain)"
          echo "P02_LEAN_BIN_DIR=$P02_LEAN_BIN_DIR" >> "$GITHUB_ENV"
          echo "P02_TOOLCHAIN_TRANSPORT=$P02_TOOLCHAIN_TRANSPORT" >> "$GITHUB_ENV"
          echo "P02_TOOLCHAIN_ARCHIVE_SHA256=$P02_TOOLCHAIN_ARCHIVE_SHA256" >> "$GITHUB_ENV"

      - name: Collect raw observations
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${P02_LEAN_BIN_DIR}:$PATH"
          python scripts/p02_same_category_collect.py             --case-spec /tmp/P02_CASE_SPEC.json             --pinned-project /tmp/mathevidence-pinned             --out "${RAW_DIR}"             --prereg-commit "${PREREG_COMMIT}"             --timeout-seconds 30

      - name: Classify with previously frozen hardened mapper
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:scripts/p02_classify_native_v2_hardened.py)" = "${CLASSIFIER_V2_BLOB_SHA}"
          python scripts/p02_same_category_classify.py --raw "${RAW_DIR}" --out "${CLASSIFIED_DIR}" --prereg-commit "${PREREG_COMMIT}"

      - name: Materialize sealed expectations and analyze
        shell: bash
        run: |
          set -euo pipefail
          git show "${PREREG_COMMIT}:experiments/p02_same_category_v2/EXPECTED_RESULTS.json" > /tmp/P02_EXPECTED_RESULTS.json
          cmp /tmp/P02_EXPECTED_RESULTS.json experiments/p02_same_category_v2/EXPECTED_RESULTS.json
          python scripts/p02_same_category_analyze.py             --raw "${RAW_DIR}"             --classified "${CLASSIFIED_DIR}"             --expected /tmp/P02_EXPECTED_RESULTS.json             --out "${ANALYSIS_DIR}"             --prereg-commit "${PREREG_COMMIT}"

      - name: Commit immutable follow-up evidence
        shell: bash
        run: |
          set -euo pipefail
          git add evidence/p02_same_category_v2
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -v '^evidence/p02_same_category_v2/' ; then
            echo "unexpected staged path" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record preregistered P02 same-category follow-up evidence"
          git push origin HEAD:science/p02-same-category-v2-20261001

      - name: Enforce preregistered stop condition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/p02_same_category_v2/analysis_first_full/SAME_CATEGORY_ANALYSIS.json")
          a=json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps(a,indent=2,sort_keys=True))
          assert a["status"] == "PREREGISTERED_EXPECTATIONS_MATCH"
          assert a["n_states"] == 12
          assert a["n_state_matches"] == 12
          assert a["n_active_edges"] == 12
          assert a["n_edge_matches"] == 12
          assert a["observed_category_changes"] == 6
          assert a["observed_category_preservations"] == 6
          PY
