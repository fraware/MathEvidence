name: p02-mathai-raw-feedback-independent-review

on:
  push:
    branches:
      - science/p02-mathai-raw-feedback-audit-20260929
    paths:
      - .github/workflows/p02-mathai-raw-feedback-independent-review.yml
      - scripts/p02_mathai_raw_feedback_independent_review.py
  workflow_dispatch:

permissions:
  contents: write

env:
  PRIOR_AUDIT: evidence/p02_mathai_raw_feedback_postreview_v1/RAW_FEEDBACK_ALIASING_AUDIT.json
  OUT_DIR: evidence/p02_mathai_raw_feedback_postreview_v1_review

jobs:
  independent-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Independently recompute raw observation equality
        shell: bash
        run: |
          set -euo pipefail
          test -f "${PRIOR_AUDIT}"
          test ! -e "${OUT_DIR}"
          python scripts/p02_mathai_raw_feedback_independent_review.py \
            --root . \
            --prior-audit "${PRIOR_AUDIT}" \
            --out "${OUT_DIR}"

      - name: Enforce publication gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("evidence/p02_mathai_raw_feedback_postreview_v1_review/INDEPENDENT_REVIEW.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["status"] == "VERIFIED_BY_INDEPENDENT_RECOMPUTATION", d
          assert d["publication_claim_eligible"] is True, d
          assert d["n_masked_active_edges"] == 34, d
          assert d["identical"] == 16, d
          assert d["different"] == 18, d
          assert d["edge_level_disagreements_with_primary_audit"] == 0, d
          PY

      - name: Commit independent review
        shell: bash
        run: |
          set -euo pipefail
          git add "${OUT_DIR}"
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -v '^evidence/p02_mathai_raw_feedback_postreview_v1_review/' ; then
            echo "unexpected staged path" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Verify MATH-AI raw-feedback audit independently"
          git push origin HEAD:science/p02-mathai-raw-feedback-audit-20260929
