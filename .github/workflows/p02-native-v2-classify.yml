name: p02-native-v2-classify

on:
  push:
    branches:
      - science/p02-native-v2-20260826
    paths:
      - .github/workflows/p02-native-v2-classify.yml
      - scripts/p02_classify_native_v2_raw.py

permissions:
  contents: write

concurrency:
  group: p02-native-v2-classify
  cancel-in-progress: false

env:
  RAW_DIR: evidence/p02_native_v2/raw_first_full
  CLASSIFIED_DIR: evidence/p02_native_v2/classified_first_full

jobs:
  classify-frozen-raw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Apply frozen classifier rules to sealed raw bundle
        shell: bash
        run: |
          set -euo pipefail
          test -d "${RAW_DIR}"
          test ! -e "${CLASSIFIED_DIR}"
          python scripts/p02_classify_native_v2_raw.py \
            --raw "${RAW_DIR}" \
            --out "${CLASSIFIED_DIR}"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("evidence/p02_native_v2/classified_first_full/CLASSIFICATION_SUMMARY.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["status"] == "CLASSIFIED_NOT_DIFFERENTIAL_ANALYZED"
          assert d["publication_claim_eligible"] is False
          assert d["construction_metadata_read_during_classification"] is False
          assert d["classifier_rules_modified_after_raw_run"] is False
          assert d["n_cases"] == 34
          assert sum(d["derived_class_counts"].values()) == 34
          print(json.dumps(d["derived_class_counts"], sort_keys=True))
          PY

      - name: Commit classification bundle
        shell: bash
        run: |
          set -euo pipefail
          git add "${CLASSIFIED_DIR}"
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -v '^evidence/p02_native_v2/classified_first_full/' ; then
            echo "unexpected staged path" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record P02 native v2 frozen-rule classifications"
          git push origin HEAD:science/p02-native-v2-20260826
