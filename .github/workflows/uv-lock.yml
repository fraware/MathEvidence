# Generate and verify committed uv.lock (ME-RV-070).
# Local Windows may hit UnknownIssuer TLS; ubuntu-latest is authoritative.
name: uv-lock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements*.txt"
      - ".github/workflows/uv-lock.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements*.txt"
      - ".github/workflows/uv-lock.yml"

permissions:
  contents: read

jobs:
  generate-uv-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv (SHA-pinned)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Generate or verify uv.lock
        run: |
          set -euo pipefail
          if [ ! -f pyproject.toml ]; then
            echo "No pyproject.toml; skipping."
            exit 0
          fi
          test -f uv.lock
          echo "Committed uv.lock present — sync frozen + lock drift check."
          uv sync --frozen --extra dev --extra sympy
          uv lock --check

      - name: Upload uv.lock artifact
        if: hashFiles('uv.lock') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uv-lock
          path: uv.lock
          if-no-files-found: error

      - name: Summarize
        run: |
          if [ -f uv.lock ]; then
            echo "uv.lock ready on ubuntu-latest (authoritative TLS path)."
            wc -l uv.lock
            head -n 5 uv.lock
          else
            echo "uv.lock not produced"
            exit 1
          fi
