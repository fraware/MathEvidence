name: p02-native-v2-repair-raw

on:
  push:
    branches:
      - science/p02-native-v2-20260826
    paths:
      - .github/workflows/p02-native-v2-repair.yml
      - scripts/p02_native_v2_repair_raw.py

permissions:
  contents: write

concurrency:
  group: p02-native-v2-repair-raw
  cancel-in-progress: false

env:
  PINNED_PROJECT_SHA: 946d2f7b14840837a5b641150c9df9008c4be9eb
  BASELINE_DIR: evidence/p02_native_v2/raw_first_full
  REPAIR_RAW_DIR: evidence/p02_native_v2/repair_raw_first_full

jobs:
  collect-repair-observations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence branch with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Materialize exact pinned MathEvidence worktree
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${PINNED_PROJECT_SHA}^{commit}"
          rm -rf /tmp/mathevidence-pinned
          git worktree add --detach /tmp/mathevidence-pinned "${PINNED_PROJECT_SHA}"
          test "$(git -C /tmp/mathevidence-pinned rev-parse HEAD)" = "${PINNED_PROJECT_SHA}"
          test -z "$(git -C /tmp/mathevidence-pinned status --porcelain)"
          test "$(cat /tmp/mathevidence-pinned/lean-toolchain)" = "leanprover/lean4:v4.14.0"

      - name: Install checksum-pinned elan from pinned tree
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/mathevidence-pinned/scripts/ci/install-elan-pinned.sh

      - name: Initialize and verify pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cd /tmp/mathevidence-pinned
          lake env lean --version
          lake --version
          test -z "$(git status --porcelain)"

      - name: Collect preregistered raw repair observations
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          command -v elan
          command -v lake
          test -d "${BASELINE_DIR}"
          test ! -e "${REPAIR_RAW_DIR}"
          python scripts/p02_native_v2_repair_raw.py \
            --baseline "${BASELINE_DIR}" \
            --pinned-project /tmp/mathevidence-pinned \
            --out "${REPAIR_RAW_DIR}" \
            --timeout-seconds 30
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("evidence/p02_native_v2/repair_raw_first_full")
          run = json.loads((root / "RUN_MANIFEST.json").read_text(encoding="utf-8"))
          integrity = json.loads((root / "INTEGRITY_MANIFEST.json").read_text(encoding="utf-8"))
          plan = json.loads((root / "REPAIR_PLAN.json").read_text(encoding="utf-8"))
          assert run["status"] == "RAW_REPAIR_OBSERVATIONS_EXECUTED_NOT_CLASSIFIED"
          assert run["publication_claim_eligible"] is False
          assert run["classification_performed"] is False
          assert run["n_counterfactual_edges"] == 80
          assert run["n_cumulative_steps"] == 5
          assert run["n_observation_cases"] == 85
          assert run["plan_digest"] == "sha256:0b610ed6bd984acf6403046e5adf56ed5f8ae0d9a6fbce4178c6a8ede4e20565"
          assert plan["plan_digest"] == run["plan_digest"]
          assert integrity["n_files"] > 0
          print("raw P02 repair evidence bundle checks passed")
          PY

      - name: Commit immutable raw repair evidence
        shell: bash
        run: |
          set -euo pipefail
          git add "${REPAIR_RAW_DIR}"
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -v '^evidence/p02_native_v2/repair_raw_first_full/' ; then
            echo "unexpected staged path" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record P02 native v2 raw repair observations"
          git push origin HEAD:science/p02-native-v2-20260826
