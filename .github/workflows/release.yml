# Experimental 0.x release provenance. Stable promotion and production signing remain separate gates.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install elan (checksum-pinned release asset)
        run: bash scripts/ci/install-elan-pinned.sh

      - name: Restore pinned Mathlib build cache
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Install uv (SHA-pinned)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies (frozen lock required)
        run: |
          set -euo pipefail
          test -f uv.lock
          uv sync --frozen --extra dev --extra sympy
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate schemas, registry, maturity, and audits
        run: |
          set -euo pipefail
          python scripts/validate_schemas.py
          python scripts/validate_registry.py
          python scripts/validate_maturity_inventory.py
          python scripts/check_import_boundaries.py
          python scripts/audit_sorry_axioms.py
          python scripts/scaffold_env_audits.py

      - name: Lake build with lock immutability
        run: |
          set -euo pipefail
          cp lake-manifest.json /tmp/lake-manifest.before.json
          # Exact candidate execution imports capability ReplaySound declarations
          # directly, so release materializes the complete checker closure first.
          lake build \
            MathEvidenceCheckers \
            mathevidence-verify-bundle \
            mathevidence-kernel-replay \
            mathevidence-declaration-identity \
            mathevidence-import-graph \
            mathevidence-axiom-report
          cmp /tmp/lake-manifest.before.json lake-manifest.json
          git diff --exit-code -- lake-manifest.json lean-toolchain

      - name: Production-generated CR exact Lean E2E + declaration identity
        run: |
          set -euo pipefail
          python scripts/ci/run_cr_exact_lean_e2e_production.py | tee /tmp/cr-exact-lean-e2e.jsonl

      - name: Offline bundle replay + tamper + exe smoke
        env:
          MATHEVIDENCE_ADAPTER_MODE: fixture
          MATHEVIDENCE_REQUIRE_EXE_SMOKE: "1"
          MATHEVIDENCE_OFFLINE: "1"
        run: |
          set -euo pipefail
          python scripts/offline_replay_python.py
          python -m pytest tests/forensic/test_offline_exact_replay.py -q
          python scripts/smoke_exe.py
          python scripts/smoke_ideal_membership.py

      - name: Generate exact-tree provenance + SBOM + digests
        run: |
          set -euo pipefail
          mkdir -p dist/provenance dist/sbom dist/signed
          python scripts/generate_release_provenance.py dist/provenance
          test -f dist/provenance/provenance-manifest.json
          python scripts/generate_sbom.py dist/sbom
          test -f dist/sbom/sbom.json || test -n "$(ls -A dist/sbom 2>/dev/null)"
          (
            cd dist
            find . -type f -print0 | sort -z | xargs -0 sha256sum > provenance/artifact-digests.sha256
          )
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("dist/provenance/provenance-manifest.json")
          m = json.loads(path.read_text(encoding="utf-8"))
          assert m.get("schemaVersion") == "0.2.0"
          assert m.get("leanToolchain"), "missing leanToolchain pin"
          assert m.get("gitCommit") == os.environ.get("GITHUB_SHA"), "release SHA mismatch"
          assert m.get("gitTree") and m["gitTree"] != "unknown", "missing git tree"
          maturity = m.get("maturityInventory") or {}
          assert str(maturity.get("digest") or "").startswith("sha256:")
          assert maturity.get("auditedBaselineCommit"), "missing maturity baseline"
          assert m.get("registryFiles"), "missing registry trust-surface hashes"
          assert m.get("schemaFiles"), "missing schema trust-surface hashes"
          assert m.get("workflowFiles"), "missing workflow trust-surface hashes"
          assert m.get("lockFiles"), "missing lock/toolchain hashes"
          lake = m.get("lake") or {}
          assert lake.get("packages"), "missing lake package pins"
          print(
              "provenance ok:",
              m["gitCommit"],
              m["gitTree"],
              "registry=", len(m["registryFiles"]),
              "schemas=", len(m["schemaFiles"]),
          )
          PY

      - name: Record signing status explicitly
        run: |
          set -euo pipefail
          cat > dist/signed/STATUS.json <<'JSON'
          {
            "schemaVersion": "0.1.0",
            "signed": false,
            "status": "production_release_signing_deferred",
            "note": "This experimental release workflow does not claim a production signature. Configure and independently verify an approved release identity before advertising signed release provenance."
          }
          JSON

      - name: Recompute release artifact digests including signing status
        run: |
          set -euo pipefail
          (
            cd dist
            find . -type f ! -path './provenance/artifact-digests.sha256' -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              > provenance/artifact-digests.sha256
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-provenance
          path: |
            dist/provenance/
            dist/sbom/
            dist/signed/

      - name: Experimental prerelease publish gate (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          echo "=== MathEvidence experimental 0.x release gate ==="
          echo "This workflow does NOT infer or configure GitHub branch protection."
          echo "Verify live repository rules/settings independently before release."
          echo "This workflow does NOT auto-publish a GitHub Release."
          echo "This workflow does NOT claim production release signing."
          echo "Manual maintainer sequence after all exact-SHA checks are green:"
          echo "  1. Verify the intended commit SHA and branch/ruleset state."
          echo "  2. Create an immutable experimental tag on that exact SHA."
          echo "  3. Run/download this release-provenance artifact for the tag."
          echo "  4. Verify artifact-digests.sha256 and inspect STATUS.json."
          echo "  5. Publish a GitHub prerelease only with experimental scope/limitations."
          echo "Stable promotion and production signing remain separate explicit gates."
