name: p02-mathai-cross-context-smoke

on:
  push:
    branches:
      - science/p02-mathai-cross-context-20260827
    paths:
      - .github/workflows/p02-mathai-cross-context-smoke.yml
      - scripts/p02_mathai_cross_context_smoke_raw.py

permissions:
  contents: write

concurrency:
  group: p02-mathai-cross-context-smoke
  cancel-in-progress: false

env:
  PINNED_PROJECT_SHA: 946d2f7b14840837a5b641150c9df9008c4be9eb
  PINNED_LEAN_TOOLCHAIN: leanprover/lean4:v4.14.0
  EVIDENCE_DIR: evidence/p02_mathai_cross_context/smoke_raw_first

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cross-context evidence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Materialize exact pinned MathEvidence worktree
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${PINNED_PROJECT_SHA}^{commit}"
          rm -rf /tmp/mathevidence-pinned
          git worktree add --detach /tmp/mathevidence-pinned "${PINNED_PROJECT_SHA}"
          test "$(git -C /tmp/mathevidence-pinned rev-parse HEAD)" = "${PINNED_PROJECT_SHA}"
          test -z "$(git -C /tmp/mathevidence-pinned status --porcelain)"
          test "$(cat /tmp/mathevidence-pinned/lean-toolchain)" = "${PINNED_LEAN_TOOLCHAIN}"

      - name: Install checksum-pinned elan from pinned tree
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/mathevidence-pinned/scripts/ci/install-elan-pinned.sh

      - name: Materialize the already frozen Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          elan toolchain install "${PINNED_LEAN_TOOLCHAIN}"
          cd /tmp/mathevidence-pinned
          lake env lean --version
          test "$(cat lean-toolchain)" = "${PINNED_LEAN_TOOLCHAIN}"

      - name: Build only preregistered context import modules
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathevidence-pinned
          # Build the three modules imported by the frozen smoke corpus and
          # their transitive dependencies. Do not build the broader
          # MathEvidenceAssurance barrel, which includes unrelated QAOS modules.
          lake build \
            +MathEvidence.Assurance.RationalEquality \
            +MathEvidence.Assurance.Calculus \
            +MathEvidence.Assurance.LinearAlgebra
          test -f .lake/build/lib/lean/MathEvidence/Assurance/RationalEquality.olean
          test -f .lake/build/lib/lean/MathEvidence/Assurance/Calculus.olean
          test -f .lake/build/lib/lean/MathEvidence/Assurance/LinearAlgebra.olean
          test "$(git rev-parse HEAD)" = "${PINNED_PROJECT_SHA}"

      - name: Execute preregistered clean + single-perturbation smoke gate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "${EVIDENCE_DIR}"
          python scripts/p02_mathai_cross_context_smoke_raw.py \
            --pinned-project /tmp/mathevidence-pinned \
            --out "${EVIDENCE_DIR}" \
            --timeout-seconds 30
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('evidence/p02_mathai_cross_context/smoke_raw_first')
          run = json.loads((root / 'RUN_MANIFEST.json').read_text(encoding='utf-8'))
          integrity = json.loads((root / 'INTEGRITY_MANIFEST.json').read_text(encoding='utf-8'))
          assert run['status'] == 'SMOKE_RAW_EXECUTED_NOT_CLASSIFIED'
          assert run['publication_claim_eligible'] is False
          assert run['classification_performed'] is False
          assert run['compound_states_executed'] is False
          assert run['repair_campaign_executed'] is False
          assert run['n_cases'] == 15
          assert run['n_contexts'] == 3
          assert integrity['n_files'] > 0
          print('cross-context smoke raw bundle checks passed')
          PY

      - name: Commit immutable smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          git add "${EVIDENCE_DIR}"
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -v '^evidence/p02_mathai_cross_context/smoke_raw_first/' ; then
            echo "unexpected staged path" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record P02 MATH-AI cross-context smoke raw observations"
          git push origin HEAD:science/p02-mathai-cross-context-20260827
