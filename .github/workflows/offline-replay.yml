# Offline replay with backends unavailable (Python + Lean checker + exact structure).
name: offline-replay

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv (SHA-pinned)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dependencies (frozen lock required)
        run: |
          set -euo pipefail
          test -f uv.lock
          uv sync --frozen --extra dev --extra sympy
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Assert replay does not require backends
        run: |
          python - <<'PY'
          import os, shutil
          os.environ["MATHEVIDENCE_ADAPTER_MODE"] = "fixture"
          for name in ("math", "wolframscript", "sage"):
              path = shutil.which(name)
              if path:
                  print(f"note: {name} present at {path}; replay must not invoke it")
          print("backend executables not required for offline replay")
          PY

      - name: Python offline replay (schemas + digests)
        env:
          MATHEVIDENCE_ADAPTER_MODE: fixture
        run: python scripts/offline_replay_python.py

      - name: Exact offline bundle structure (network disabled)
        env:
          MATHEVIDENCE_OFFLINE: "1"
          MATHEVIDENCE_ADAPTER_MODE: fixture
        run: |
          set -euo pipefail
          python -m pytest tests/forensic/test_offline_exact_replay.py -q
          tmp=$(mktemp -d)
          python scripts/offline_exact_replay.py build --out "$tmp/ideal-ref"
          python scripts/offline_exact_replay.py replay --bundle "$tmp/ideal-ref" --both-modes

      - name: Install elan (checksum-pinned release asset)
        run: bash scripts/ci/install-elan-pinned.sh

      - name: Restore pinned Mathlib build cache
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Lean offline replay (checker fixtures + tactic examples)
        env:
          MATHEVIDENCE_ADAPTER_MODE: fixture
        run: |
          set -euo pipefail
          echo "::notice title=offline-replay Lean leg::Failure here is setup/Lean build, not Python exact-bundle integrity."
          lake build MathEvidence.Checkers.RationalEquality.OfflineFixtures
          lake build MathEvidence.Tactic.Examples
